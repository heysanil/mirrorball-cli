name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # mirb is a program about processes, sockets and signals. Those are exactly the things
    # that differ between kernels, so "it passed on Linux" is not evidence about macOS.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version the project is developed against; bump deliberately.
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Test
        run: bun test

      # Compiling is the only way to catch things that work under `bun run` but not inside a
      # standalone binary (dynamic imports, embedded assets, top-level await in the entry).
      - name: Build (smoke test)
        run: bunx bunli build --targets native

      - name: Compiled binary starts
        # bunli names the executable after the entry file, not after the CLI, and only
        # creates per-target subdirectories for multi-target builds. Find it rather than
        # hardcoding a path that quietly changes when the entry is renamed.
        run: |
          bin=$(find dist -maxdepth 2 -type f -perm -u+x | head -n 1)
          test -n "$bin" || { echo "no executable in dist/"; exit 1; }
          echo "running $bin --version"
          "$bin" --version

  npm-packages:
    # Guards the npm publish path, which otherwise gets exercised for the first time during
    # a release — when it is most expensive to find out it is broken.
    name: npm platform packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # scripts/ is outside the tsconfig `include`, so the repo-wide typecheck skips it.
      - name: Typecheck the generator
        run: >
          bun x tsc --noEmit --strict --noUncheckedIndexedAccess
          --target ES2022 --module esnext --moduleResolution bundler
          --allowImportingTsExtensions --verbatimModuleSyntax --skipLibCheck
          --types bun scripts/build-npm-packages.ts

      - name: Build native binary
        run: bunx bunli build --targets native

      - name: Stand in for the other four targets
        # Cross-compiling all five targets would add minutes to every PR. Neither the
        # generator nor the shim cares what is inside a binary, only that each target has
        # one, so the native build doubles for all five here. The real cross-compile
        # happens in release.yml.
        run: |
          bin=$(find dist -maxdepth 2 -type f -perm -u+x | head -n 1)
          test -n "$bin" || { echo "no executable in dist/"; exit 1; }
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            mkdir -p "stage/$target" && cp "$bin" "stage/$target/mirb"
          done
          mkdir -p stage/windows-x64 && cp "$bin" stage/windows-x64/mirb.exe

      - name: Generate the publish tree
        run: >
          bun scripts/build-npm-packages.ts
          --source dist --dist stage --out /tmp/npm-tree --version 0.0.0-ci

      - name: Shim dispatches to the installed platform package
        # Reproduces what npm leaves on disk: the root package plus exactly one platform
        # package, the other four having been skipped by their os/cpu fields.
        run: |
          mkdir -p /tmp/install/node_modules
          cp -R /tmp/npm-tree/mirb /tmp/install/node_modules/mirb
          cp -R /tmp/npm-tree/mirb-linux-x64 /tmp/install/node_modules/mirb-linux-x64
          node /tmp/install/node_modules/mirb/bin/mirb --version

      - name: Shim names the platform when no binary is installed
        # The single most common way this packaging pattern fails for users. If the message
        # ever stops naming the missing package, they are left with a bare stack trace.
        run: |
          rm -rf /tmp/install/node_modules/mirb-linux-x64
          ! node /tmp/install/node_modules/mirb/bin/mirb --version 2>/tmp/shim-error
          cat /tmp/shim-error
          grep -q 'mirb-linux-x64' /tmp/shim-error
          grep -q 'linux-x64' /tmp/shim-error
