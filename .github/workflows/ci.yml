name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # mirb is a program about processes, sockets and signals. Those are exactly the things
    # that differ between kernels, so "it passed on Linux" is not evidence about macOS.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version the project is developed against; bump deliberately.
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Test
        run: bun test

      # Compiling is the only way to catch things that work under `bun run` but not inside a
      # standalone binary (dynamic imports, embedded assets, top-level await in the entry).
      - name: Build (smoke test)
        run: bunx bunli build --targets native

      - name: Compiled binary starts
        # bunli names the executable after the entry file, not after the CLI, and only
        # creates per-target subdirectories for multi-target builds. Find it rather than
        # hardcoding a path that quietly changes when the entry is renamed.
        run: |
          bin=$(find dist -maxdepth 2 -type f -perm -u+x | head -n 1)
          test -n "$bin" || { echo "no executable in dist/"; exit 1; }
          echo "running $bin --version"
          "$bin" --version
