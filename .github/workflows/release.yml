name: Release

on:
  push:
    tags: ['v*.*.*']
  # Lets the pipeline be exercised without cutting a release. A dispatched run builds,
  # cross-compiles and packages exactly as a tagged one does, then stops before publishing —
  # so the expensive, environment-sensitive half can be verified on demand rather than
  # discovered to be broken at the next tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: Binaries and GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Cross-compiling needs each target's OpenTUI runtime package present on disk. Those
      # arrive as platform-gated optional dependencies, so an ordinary `bun install` fetches
      # only the host's and `bunli build --targets all` then fails with:
      #   Missing OpenTUI platform runtime packages required for standalone compilation
      # Installing with the wildcards pulls all of them. Verified by reproducing the failure
      # locally and fixing it exactly this way.
      - name: Install with every platform's optional dependencies
        run: bun install --frozen-lockfile --os '*' --cpu '*'

      - name: Derive version from the tag
        id: version
        run: |
          # On a dispatched run the ref is a branch, so fall back to package.json.
          case "$GITHUB_REF" in
            refs/tags/*) version="${GITHUB_REF_NAME#v}" ;;
            *)           version=$(bun --print "require('./package.json').version") ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Everything below replaces AryaLabsHQ/bunli-releaser@v1, which its README documents
      # but which was never tagged: the repository has branches and no tags at all, so `@v1`
      # cannot resolve and the first real release failed with "unable to find version v1".
      # Rather than pin an unversioned third party by SHA, the four things it did for us are
      # spelled out here. They are not complicated, and this way the release pipeline has no
      # dependency that can disappear.
      #
      # bunli.config.ts must keep `build.compress: false`: with compression on, `bunli build`
      # tars each per-target directory and deletes it, and the packaging below then finds an
      # archive where it expected a binary.
      - name: Build every target
        run: bunx bunli build --targets all

      - name: Package archives and checksums
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in dist/*/; do
            target=$(basename "$dir")
            case "$target" in
              windows-*) (cd "$dir" && zip -q "$GITHUB_WORKSPACE/release/mirb-$VERSION-$target.zip" mirb.exe) ;;
              *)         tar -czf "release/mirb-$VERSION-$target.tar.gz" -C "$dir" mirb ;;
            esac
          done
          # `<sha256>  <name>`, which is what scripts/install.sh and the npm generator parse.
          (cd release && sha256sum mirb-* > checksums.txt)
          echo "--- release assets ---"
          ls -lh release
          cat release/checksums.txt

      - name: Publish the GitHub Release
        # Only a tag publishes. A dispatched run has proved the build and stops here.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Idempotent: the release may already exist if it was cut by hand or this job is a
          # re-run. --clobber replaces an asset of the same name rather than failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "mirrorball $TAG" --generate-notes
          fi

  npm:
    name: Publish to npm
    needs: binaries
    runs-on: ubuntu-latest
    # A repo without NPM_TOKEN configured should still get a green release with binaries,
    # rather than a half-red run that looks like the build broke. Secrets are not available
    # to a job-level `if`, so the token is lifted into the job env and each step guards on
    # it — the same check, just where the expression can see it.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    permissions:
      contents: read
      # Required for npm provenance: npm exchanges this OIDC token for a signed attestation
      # linking the published tarballs to this workflow run.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Derive version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Skip note
        if: env.NPM_TOKEN == ''
        run: |
          echo "::notice::NPM_TOKEN is not set, so the npm packages were not published."
          echo "::notice::Binaries and checksums are on the GitHub Release. Set the secret and re-run this job to publish."

      - name: Generate the publish tree from the released binaries
        if: env.NPM_TOKEN != ''
        # Downloads the assets job 1 just uploaded and verifies them against checksums.txt,
        # so the bytes on npm are the same bytes on the GitHub Release rather than a second,
        # separately-compiled build. Release assets can lag a few seconds behind the API, so
        # retry rather than fail a release on a 404.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            if bun scripts/build-npm-packages.ts --source release --version "$VERSION"; then
              exit 0
            fi
            echo "release assets not ready (attempt $attempt/5); retrying in 15s"
            sleep 15
          done
          echo "gave up waiting for release assets for v$VERSION"
          exit 1

      - name: Publish
        if: env.NPM_TOKEN != ''
        # Platform packages first. The root package pins them by exact version, so publishing
        # it before they exist leaves a window where `npm i mirb` resolves to a root package
        # whose optional dependencies 404 — which npm reports as a warning, not an error, and
        # the user gets a shim with nothing to dispatch to.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The glob must not match the root package: npm/mirb-cli-*/ excludes npm/mirb-cli/,
          # whereas a looser npm/mirb-*/ would sweep the root in and publish it first.
          for pkg in npm/mirb-cli-*/; do
            echo "publishing $pkg"
            (cd "$pkg" && npm publish --access public --provenance)
          done
          echo "publishing npm/mirb-cli/"
          (cd npm/mirb-cli && npm publish --access public --provenance)
